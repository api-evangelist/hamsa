name: Hamsa
description: >-
  Hamsa (formerly HamsaPay) is a San Francisco-based financial infrastructure
  company "powering the Finternet." It builds the Hamsa Unified Confidential
  Ledger (UCL), a privacy-enabled, EVM-compatible, permissioned Layer-2
  blockchain for banks and financial institutions, plus the Hamsa Privacy
  module that uses zero-knowledge-proof (ZKP) rollups on Hyperledger Besu to run
  confidential Delivery-versus-Payment (DvP) and Payment-versus-Payment (PvP)
  settlement, tokenized deposits, stablecoins, and CBDCs. The developer platform
  exposes an EVM-standard JSON-RPC API (eth_* methods) and DvP escrow smart
  contracts, authenticated with Ethereum message signatures and role-based
  access control. Hamsa has tokenized over $3.2B for Tier-1/Tier-2 banks
  (including Banco Safra's Safra Dolar stablecoin) and participates in the
  Brazilian Drex CBDC pilot.
